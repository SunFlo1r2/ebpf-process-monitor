<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBPF 安全事件监控仪表板</title>
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 头部样式 */
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: #a0a0a0;
            font-size: 14px;
        }
        
        /* 状态栏 */
        .status-bar {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .status-item {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-item.connected {
            background: rgba(40, 167, 69, 0.2);
            border-color: rgba(40, 167, 69, 0.3);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .status-dot.connected {
            background: #28a745;
        }
        .status-dot.disconnected {
            background: #dc3545;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .stat-card.high {
            border-left: 4px solid #dc3545;
        }
        .stat-card.medium {
            border-left: 4px solid #ffc107;
        }
        .stat-card.low {
            border-left: 4px solid #28a745;
        }
        .stat-card .icon {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .stat-card .label {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }
        
        /* 过滤器 */
        .filters {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group label {
            color: #a0a0a0;
            font-size: 14px;
        }
        .filter-group select, .filter-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
        }
        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* 事件列表 */
        .events-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        .events-header h2 {
            font-size: 24px;
        }
        .view-toggle {
            display: flex;
            gap: 8px;
        }
        .view-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .view-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .view-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }
        .events-list {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 8px;
        }
        #tableView {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 8px;
        }
        .events-list::-webkit-scrollbar {
            width: 8px;
        }
        .events-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .events-list::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }
        #tableView::-webkit-scrollbar {
            width: 8px;
        }
        #tableView::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        #tableView::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }
        
        /* 表格样式 */
        .events-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .events-table thead {
            position: sticky;
            top: 0;
            background: rgba(26, 26, 46, 0.95);
            z-index: 10;
        }
        .events-table th {
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            color: #667eea;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }
        .events-table td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .events-table tbody tr:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        .events-table tbody tr.new-event {
            animation: highlight 2s ease-out;
        }
        @keyframes highlight {
            0% {
                background: rgba(102, 126, 234, 0.3);
            }
            100% {
                background: transparent;
            }
        }
        
        /* 事件卡片 */
        .event-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border-left: 4px solid;
            transition: all 0.3s;
        }
        .event-item:hover {
            transform: translateX(4px);
            background: rgba(0, 0, 0, 0.4);
        }
        .event-item.high {
            border-left-color: #dc3545;
        }
        .event-item.medium {
            border-left-color: #ffc107;
        }
        .event-item.low {
            border-left-color: #28a745;
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .event-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .event-comm {
            font-weight: 700;
            font-size: 18px;
        }
        .event-id {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #a0a0a0;
        }
        .risk-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .risk-badge.high {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        .risk-badge.medium {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        .risk-badge.low {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        .event-meta {
            color: #a0a0a0;
            font-size: 13px;
        }
        .event-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            font-size: 13px;
            color: #e0e0e0;
        }
        .event-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .event-detail-item span {
            color: #a0a0a0;
        }
        .event-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-execve {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }
        .badge-setuid {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        .badge-file-write {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
        .badge-privilege {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #a0a0a0;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }
        .loading-spinner {
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 时间线模态框样式 */
        .timeline-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .timeline-modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow: hidden;
            border: 1px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .timeline-modal-header {
            background: rgba(102, 126, 234, 0.2);
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        .timeline-modal-header h2 {
            font-size: 24px;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .timeline-close-btn {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #dc3545;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .timeline-close-btn:hover {
            background: rgba(220, 53, 69, 0.4);
            transform: scale(1.1);
        }
        
        .timeline-modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: calc(90vh - 100px);
        }
        
        .timeline-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .timeline-info-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .info-label {
            color: #a0a0a0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .info-value {
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 600;
        }
        
        .timeline-events {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 24px;
        }
        
        .timeline-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 700;
        }
        
        .timeline-event {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.3s ease;
        }
        
        .timeline-event:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .timeline-time {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }
        
        .timeline-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .timeline-diff {
            font-size: 12px;
            color: #a0a0a0;
            font-weight: 600;
        }
        
        .timeline-content {
            flex: 1;
        }
        
        .timeline-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .timeline-header strong {
            font-size: 16px;
            color: #e0e0e0;
        }
        
        .timeline-detail {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .timeline-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #666;
        }
        
        .timeline-empty {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }
        
        /* 时间线按钮样式 */
        .timeline-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .timeline-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* 取证报告导出模态框样式 */
        .export-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }

        .export-modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .export-modal-header {
            background: rgba(102, 126, 234, 0.2);
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
        }

        .export-modal-header h2 {
            font-size: 20px;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .export-close-btn {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #dc3545;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .export-close-btn:hover {
            background: rgba(220, 53, 69, 0.4);
            transform: scale(1.1);
        }

        .export-modal-body {
            padding: 24px;
        }

        .export-form-group {
            margin-bottom: 20px;
        }

        .export-form-group label {
            display: block;
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .export-format-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .export-format-option {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .export-format-option:hover {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .export-format-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .export-format-option input[type="radio"] {
            margin: 0;
            cursor: pointer;
        }

        .export-format-info {
            flex: 1;
        }

        .export-format-title {
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .export-format-desc {
            font-size: 12px;
            color: #a0a0a0;
        }

        .export-modal-footer {
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .export-progress {
            display: none;
            margin-top: 16px;
        }

        .export-progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .export-progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .export-progress-text {
            text-align: center;
            color: #a0a0a0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🛡️ eBPF 安全事件监控仪表板</h1>
            <p>实时监控进程执行、权限提升和安全事件</p>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot disconnected" id="connectionStatus"></span>
                    <span id="connectionText">未连接</span>
                </div>
                <div class="status-item connected">
                    <span class="status-dot connected"></span>
                    <span id="totalEvents">0</span> 事件总数
                </div>
                <div class="status-item">
                    <span id="last24Hours">0</span> 近24小时
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card high">
                <div class="icon">🔴</div>
                <div class="label">高风险事件</div>
                <div class="value" id="highRiskCount">0</div>
            </div>
            <div class="stat-card medium">
                <div class="icon">🟡</div>
                <div class="label">中风险事件</div>
                <div class="value" id="mediumRiskCount">0</div>
            </div>
            <div class="stat-card low">
                <div class="icon">🟢</div>
                <div class="label">低风险事件</div>
                <div class="value" id="lowRiskCount">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="label">SETUID 事件</div>
                <div class="value" id="setuidCount">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">🚀</div>
                <div class="label">EXECVE 事件</div>
                <div class="value" id="execveCount">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">🌐</div>
                <div class="label">CONNECT 事件</div>
                <div class="value" id="connectCount">0</div>
            </div>
            <div class="stat-card">
                <div class="icon">📂</div>
                <div class="label">OPENAT 事件</div>
                <div class="value" id="openatCount">0</div>
            </div>
        </div>

        <!-- 过滤器 -->
        <div class="filters">
            <div class="filter-group">
                <label>风险等级:</label>
                <select id="riskLevelFilter" onchange="applyFilters()">
                    <option value="">全部</option>
                    <option value="HIGH">高风险</option>
                    <option value="MEDIUM">中风险</option>
                    <option value="LOW">低风险</option>
                </select>
            </div>
            <div class="filter-group">
                <label>事件类型:</label>
                <select id="eventTypeFilter" onchange="applyFilters()">
                    <option value="">全部</option>
                    <option value="0">EXECVE</option>
                    <option value="1">SETUID</option>
                    <option value="2">FILE_WRITE</option>
                    <option value="3">OPENAT</option>
                    <option value="4">CONNECT</option>
                    <option value="5">BIND</option>
                    <option value="6">EXIT</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Agent ID:</label>
                <input type="text" id="agentIdFilter" placeholder="输入 Agent ID" onchange="applyFilters()">
            </div>
            <button class="btn" onclick="loadHighRiskEvents()">🔴 仅显示高风险</button>
            <button class="btn btn-secondary" onclick="loadStatistics()">📊 刷新统计</button>
            <button class="btn" onclick="exportForensicReportBatch()" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">📄 批量导出取证报告</button>
            <button class="btn btn-secondary" onclick="sendTestEvent()">📤 发送测试事件</button>
        </div>

        <!-- 事件列表 -->
        <div class="events-section">
            <div class="events-header">
                <h2>安全事件列表</h2>
                <div class="view-toggle">
                    <button class="view-btn active" onclick="switchView('card')" id="cardViewBtn">
                        📋 卡片视图
                    </button>
                    <button class="view-btn" onclick="switchView('table')" id="tableViewBtn">
                        📊 表格视图
                    </button>
                </div>
            </div>
            
            <!-- 卡片视图 -->
            <div class="events-list" id="eventsList" style="display: block;">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>
            
            <!-- 表格视图 -->
            <div id="tableView" style="display: none;">
                <div id="react-table-root"></div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket 连接
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const eventsList = document.getElementById('eventsList');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionText = document.getElementById('connectionText');
        
        // 加载统计数据
        async function loadStatistics() {
            try {
                const response = await fetch(`http://${window.location.host}/api/statistics`);
                const stats = await response.json();
                
                document.getElementById('totalEvents').textContent = stats.total_events;
                document.getElementById('last24Hours').textContent = stats.last_24_hours;
                document.getElementById('highRiskCount').textContent = stats.risk_level_distribution.HIGH || 0;
                document.getElementById('mediumRiskCount').textContent = stats.risk_level_distribution.MEDIUM || 0;
                document.getElementById('lowRiskCount').textContent = stats.risk_level_distribution.LOW || 0;
                document.getElementById('setuidCount').textContent = stats.event_type_distribution.SETUID || 0;
                document.getElementById('execveCount').textContent = stats.event_type_distribution.EXECVE || 0;
                document.getElementById('connectCount').textContent = stats.event_type_distribution.CONNECT || 0;
                document.getElementById('openatCount').textContent = stats.event_type_distribution.OPENAT || 0;
            } catch (error) {
                console.error('Failed to load statistics:', error);
            }
        }

        // 加载事件列表
        async function loadEvents(params = {}) {
            try {
                const queryParams = new URLSearchParams(params);
                const response = await fetch(`http://${window.location.host}/api/events?${queryParams}`);
                const events = await response.json();
                
                displayEvents(events);
            } catch (error) {
                console.error('Failed to load events:', error);
                eventsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>加载失败</p>
                    </div>
                `;
            }
        }

        // 加载高风险事件
        async function loadHighRiskEvents() {
            document.getElementById('riskLevelFilter').value = 'HIGH';
            applyFilters();
        }

        // 应用过滤器
        function applyFilters() {
            const params = {
                limit: 100
            };
            
            const riskLevel = document.getElementById('riskLevelFilter').value;
            const eventType = document.getElementById('eventTypeFilter').value;
            const agentId = document.getElementById('agentIdFilter').value;
            
            if (riskLevel) params.risk_level = riskLevel;
            if (eventType) params.event_type = eventType;
            if (agentId) params.agent_id = agentId;
            
            loadEvents(params);
        }

        // 显示事件
        function displayEvents(events) {
            if (!events || events.length === 0) {
                eventsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无事件</p>
                    </div>
                `;
                return;
            }

            eventsList.innerHTML = '';
            events.forEach(event => {
                const eventItem = createEventItem(event);
                eventsList.appendChild(eventItem);
            });
        }

        // 获取风险特征说明
        function getRiskFeatures(event) {
            const features = [];
            const comm = (event.comm || '').toLowerCase();
            
            // 1. 检测反向Shell
            const shellProcesses = ['bash', 'sh', 'zsh', 'dash', 'tcsh', 'csh', 'fish'];
            if (event.event_type === 4 && shellProcesses.some(shell => comm === shell || comm.startsWith(shell))) {
                features.push({
                    type: 'HIGH',
                    name: '反向Shell检测',
                    desc: 'Shell进程发起TCP出站连接，可能是反向Shell攻击'
                });
            }
            
            // 2. 检测可疑工具
            const suspiciousTools = ['nc', 'netcat', 'socat', 'telnet', 'ncat', 'wget', 'curl', 'fetch', 'lynx', 'tftp', 'ftp'];
            if (suspiciousTools.some(tool => comm === tool || comm.includes(tool))) {
                features.push({
                    type: 'HIGH',
                    name: '可疑工具检测',
                    desc: '检测到可能被滥用的网络/下载工具'
                });
            }
            
            // 3. SETUID到root
            if (event.event_type === 1 && event.new_uid === 0 && event.old_uid !== 0) {
                features.push({
                    type: 'HIGH',
                    name: 'SETUID提权',
                    desc: '从普通用户提升到root权限'
                });
            }
            
            // 4. 写入敏感文件
            if (event.event_type === 2 && (event.target_file_type === 1 || event.target_file_type === 2)) {
                features.push({
                    type: 'HIGH',
                    name: '敏感文件写入',
                    desc: `写入${event.target_file_type === 1 ? 'passwd' : 'shadow'}文件`
                });
            }
            
            // 5. 敏感文件访问
            if (event.event_type === 3 && event.target_file_type >= 3 && event.target_file_type <= 7) {
                const fileTypes = {
                    3: 'sudoers配置',
                    4: 'crontab定时任务',
                    5: 'SSH配置',
                    6: 'hosts文件',
                    7: '系统配置文件'
                };
                features.push({
                    type: 'MEDIUM',
                    name: '敏感文件访问',
                    desc: `访问${fileTypes[event.target_file_type]}`
                });
            }
            
            // 6. 非常规端口连接
            const attackPorts = [4444, 5555, 6666, 1234, 12345, 31337];
            if (event.event_type === 4 && event.dst_port && attackPorts.includes(event.dst_port)) {
                features.push({
                    type: 'MEDIUM',
                    name: '非常规端口',
                    desc: `连接到端口 ${event.dst_port}，可能是后门连接`
                });
            }
            
            // 7. 特权端口绑定
            if (event.event_type === 5 && event.src_port > 0 && event.src_port < 1024) {
                features.push({
                    type: 'MEDIUM',
                    name: '特权端口绑定',
                    desc: `绑定特权端口 ${event.src_port}，需要root权限`
                });
            }
            
            // 8. sudo/su命令
            if (comm === 'sudo' || comm === 'su' || comm === 'passwd') {
                features.push({
                    type: 'HIGH',
                    name: '特权命令',
                    desc: '执行sudo/su/passwd等特权命令'
                });
            }
            
            return features;
        }

        // 创建事件卡片
        function createEventItem(event) {
            const timestamp = new Date(event.timestamp / 1000000);
            const timeStr = timestamp.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            // 事件类型徽章
            let eventTypeBadge = '';
            let eventTypeClass = '';
            switch(event.event_type) {
                case 0:
                    eventTypeBadge = '<span class="badge badge-execve">EXECVE</span>';
                    eventTypeClass = 'badge-execve';
                    break;
                case 1:
                    eventTypeBadge = '<span class="badge badge-setuid">SETUID</span>';
                    eventTypeClass = 'badge-setuid';
                    break;
                case 2:
                    eventTypeBadge = '<span class="badge badge-file-write">FILE_WRITE</span>';
                    eventTypeClass = 'badge-file-write';
                    break;
                case 3:
                    eventTypeBadge = '<span class="badge" style="background: #17a2b8;">OPENAT</span>';
                    eventTypeClass = '';
                    break;
                case 4:
                    eventTypeBadge = '<span class="badge" style="background: #e83e8c;">CONNECT</span>';
                    eventTypeClass = '';
                    break;
                case 5:
                    eventTypeBadge = '<span class="badge" style="background: #6f42c1;">BIND</span>';
                    eventTypeClass = '';
                    break;
                case 6:
                    eventTypeBadge = '<span class="badge" style="background: #6c757d;">EXIT</span>';
                    eventTypeClass = '';
                    break;
                default:
                    eventTypeBadge = '<span class="badge">UNKNOWN</span>';
            }

            // 风险等级徽章
            const riskClass = (event.risk_level || 'LOW').toLowerCase();
            const riskBadge = `<span class="risk-badge ${riskClass}">${event.risk_level || 'LOW'}</span>`;

            // 权限提升徽章
            const privilegeBadge = event.is_privilege_escalation 
                ? '<span class="badge badge-privilege">⚠️ 权限提升</span>' 
                : '';

            // 事件描述
            let eventDesc = '';
            switch(event.event_type) {
                case 0:
                    eventDesc = event.filename || '未知文件';
                    break;
                case 1:
                    eventDesc = `UID: ${event.old_uid} → ${event.new_uid}`;
                    break;
                case 2:
                    eventDesc = event.filepath || event.filename || '未知文件';
                    break;
                case 3:
                    eventDesc = event.filepath || '未知路径';
                    break;
                case 4:
                    eventDesc = `连接: ${event.dst_addr}:${event.dst_port}`;
                    break;
                case 5:
                    eventDesc = `绑定: ${event.src_addr}:${event.src_port}`;
                    break;
                case 6:
                    eventDesc = `退出码: ${event.exit_code}`;
                    break;
            }

            // 获取风险特征
            const riskFeatures = getRiskFeatures(event);
            let featuresHTML = '';
            if (riskFeatures.length > 0) {
                featuresHTML = `
                    <div class="risk-features" style="margin-top: 12px; padding: 12px; background: rgba(0, 0, 0, 0.3); border-radius: 8px; border-left: 3px solid #667eea;">
                        <div style="font-size: 12px; color: #a0a0a0; margin-bottom: 8px; font-weight: 600;">⚡ 风险特征:</div>
                        ${riskFeatures.map(f => `
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px;">
                                <span style="padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; 
                                    ${f.type === 'HIGH' ? 'background: rgba(220, 53, 69, 0.2); color: #dc3545;' : 'background: rgba(255, 193, 7, 0.2); color: #ffc107;'}">
                                    ${f.type === 'HIGH' ? '高' : '中'}
                                </span>
                                <span style="font-weight: 600; color: #e0e0e0;">${f.name}</span>
                                <span style="color: #a0a0a0;">- ${f.desc}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            const eventItem = document.createElement('div');
            eventItem.className = `event-item ${riskClass}`;
            eventItem.innerHTML = `
                <div class="event-header">
                    <div class="event-title">
                        <span class="event-comm">${event.comm}</span>
                        <span class="event-id">ID: ${event.id}</span>
                        ${riskBadge}
                    </div>
                    <div class="event-meta">
                        <span>🕐 ${timeStr}</span>
                        ${event.agent_id ? `<span>🤖 ${event.agent_id}</span>` : ''}
                    </div>
                </div>
                <div class="event-details">
                    <div class="event-detail-item"><span>PID:</span> ${event.pid} | <span>PPID:</span> ${event.ppid}</div>
                    <div class="event-detail-item"><span>UID:</span> ${event.uid} | <span>EUID:</span> ${event.euid}</div>
                    <div class="event-detail-item"><span>GID:</span> ${event.gid} | <span>EGID:</span> ${event.egid}</div>
                    <div class="event-detail-item"><span>文件:</span> ${eventDesc}</div>
                </div>
                <div class="event-badges">
                    ${eventTypeBadge}
                    ${privilegeBadge}
                </div>
                ${featuresHTML}
                <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="timeline-btn" onclick='exportForensicReport(${event.id})'>
                        📄 导出报告
                    </button>
                    ${event.is_privilege_escalation ? `
                        <button class="timeline-btn" onclick='showTimeline(${JSON.stringify(event)})'>
                            📊 查看时间线
                        </button>
                    ` : ''}
                </div>
            `;

            return eventItem;
        }

        // 发送测试事件
        function sendTestEvent() {
            const timestamp = Date.now() * 1000000;
            const eventTypes = [0, 1, 2];
            const eventType = eventTypes[Math.floor(Math.random() * eventTypes.length)];
            
            const event = {
                timestamp: timestamp,
                pid: Math.floor(Math.random() * 10000) + 1000,
                ppid: Math.floor(Math.random() * 1000) + 1,
                uid: Math.floor(Math.random() * 2000),
                gid: Math.floor(Math.random() * 2000),
                euid: Math.floor(Math.random() * 2000),
                egid: Math.floor(Math.random() * 2000),
                old_uid: Math.floor(Math.random() * 2000),
                new_uid: Math.floor(Math.random() * 2000),
                event_type: eventType,
                target_file_type: 0,
                comm: ['ls', 'cd', 'sudo', 'npm', 'python3', 'go', 'passwd'][Math.floor(Math.random() * 7)],
                filename: ['/usr/bin/' + ['ls', 'cd', 'sudo', 'cat', 'grep', 'passwd'][Math.floor(Math.random() * 6)]][0],
                filepath: '',
                is_privilege_escalation: Math.random() > 0.7
            };
            
            if (eventType === 1) {
                event.old_uid = Math.floor(Math.random() * 2000);
                event.new_uid = 0;
                event.is_privilege_escalation = true;
            } else if (eventType === 2) {
                const files = ['passwd', 'shadow'];
                event.filepath = '/etc/' + files[Math.floor(Math.random() * files.length)];
                event.target_file_type = event.filepath.includes('passwd') ? 1 : 2;
            }

            fetch(`http://${window.location.host}/api/events`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(event)
            }).then(response => response.json())
              .then(data => {
                  console.log('Event sent:', data);
                  // 刷新数据
                  setTimeout(() => {
                      loadStatistics();
                      applyFilters();
                  }, 500);
              });
        }

        // WebSocket 连接处理
        ws.onopen = function() {
            connectionStatus.classList.remove('disconnected');
            connectionStatus.classList.add('connected');
            connectionText.textContent = '已连接';
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log('New event via WebSocket:', data);
            
            // 自动刷新统计数据
            loadStatistics();
            
            // 如果当前过滤器允许，添加新事件到列表
            applyFilters();
        };

        ws.onerror = function() {
            connectionStatus.classList.remove('connected');
            connectionStatus.classList.add('disconnected');
            connectionText.textContent = '连接错误';
        };

        ws.onclose = function() {
            connectionStatus.classList.remove('connected');
            connectionStatus.classList.add('disconnected');
            connectionText.textContent = '已断开';
        };

        // 视图切换功能
        let currentView = 'card';
        let currentEvents = [];
        
        function switchView(view) {
            currentView = view;
            const cardViewBtn = document.getElementById('cardViewBtn');
            const tableViewBtn = document.getElementById('tableViewBtn');
            const eventsList = document.getElementById('eventsList');
            const tableView = document.getElementById('tableView');
            
            if (view === 'card') {
                cardViewBtn.classList.add('active');
                tableViewBtn.classList.remove('active');
                eventsList.style.display = 'block';
                tableView.style.display = 'none';
            } else {
                cardViewBtn.classList.remove('active');
                tableViewBtn.classList.add('active');
                eventsList.style.display = 'none';
                tableView.style.display = 'block';
                renderTableView();
            }
        }

        // 时间线重建功能
        async function showTimeline(event) {
            if (!event.id) {
                alert('事件ID缺失，无法重建时间线');
                return;
            }

            const timeWindow = prompt('请输入时间窗口（分钟）:', '10');
            if (!timeWindow) return;

            const windowMinutes = parseInt(timeWindow);
            if (isNaN(windowMinutes) || windowMinutes < 1 || windowMinutes > 60) {
                alert('时间窗口必须在1-60分钟之间');
                return;
            }

            try {
                const response = await fetch(`http://${window.location.host}/api/timeline/privilege-escalation?event_id=${event.id}&time_window=${windowMinutes}`);
                const data = await response.json();

                if (data.error) {
                    alert('获取时间线失败: ' + data.error);
                    return;
                }

                displayTimelineModal(data);
            } catch (error) {
                console.error('Failed to get timeline:', error);
                alert('获取时间线失败');
            }
        }

        // 显示时间线模态框
        function displayTimelineModal(data) {
            // 移除旧模态框
            const oldModal = document.getElementById('timelineModal');
            if (oldModal) {
                oldModal.remove();
            }

            // 创建模态框
            const modal = document.createElement('div');
            modal.id = 'timelineModal';
            modal.className = 'timeline-modal';
            
            const escalationTime = new Date(data.escalation_event.timestamp / 1000000);
            const startTime = new Date(data.start_time);
            
            // 生成时间线HTML
            let timelineHTML = '';
            if (data.timeline_events && data.timeline_events.length > 0) {
                timelineHTML = data.timeline_events.map(event => {
                    const eventTime = new Date(event.timestamp / 1000000);
                    const timeDiff = Math.round((eventTime.getTime() - startTime.getTime()) / 1000);
                    
                    let eventTypeBadge = '';
                    let eventIcon = '';
                    let eventDesc = '';
                    
                    switch(event.event_type) {
                        case 0: // EXECVE
                            eventTypeBadge = '<span class="badge badge-execve">EXECVE</span>';
                            eventIcon = '🚀';
                            eventDesc = `执行: ${event.filename || '未知文件'}`;
                            break;
                        case 1: // SETUID
                            eventTypeBadge = '<span class="badge badge-setuid">SETUID</span>';
                            eventIcon = '🔐';
                            eventDesc = `权限变更: ${event.old_uid} → ${event.new_uid}`;
                            break;
                        case 2: // FILE_WRITE
                            eventTypeBadge = '<span class="badge badge-file-write">FILE_WRITE</span>';
                            eventIcon = '📝';
                            eventDesc = `写入文件: ${event.filepath || event.filename || '未知文件'}`;
                            break;
                        case 3: // OPENAT
                            eventTypeBadge = '<span class="badge" style="background: #17a2b8;">OPENAT</span>';
                            eventIcon = '📂';
                            eventDesc = `打开文件: ${event.filepath || '未知路径'}`;
                            break;
                        case 4: // CONNECT
                            eventTypeBadge = '<span class="badge" style="background: #e83e8c;">CONNECT</span>';
                            eventIcon = '🌐';
                            eventDesc = `网络连接: ${event.src_addr}:${event.src_port} → ${event.dst_addr}:${event.dst_port}`;
                            break;
                        case 5: // BIND
                            eventTypeBadge = '<span class="badge" style="background: #6f42c1;">BIND</span>';
                            eventIcon = '🔌';
                            eventDesc = `绑定端口: ${event.src_addr}:${event.src_port}`;
                            break;
                        case 6: // EXIT
                            eventTypeBadge = '<span class="badge" style="background: #6c757d;">EXIT</span>';
                            eventIcon = '🚪';
                            eventDesc = `进程退出 (退出码: ${event.exit_code})`;
                            break;
                        default:
                            eventTypeBadge = '<span class="badge">UNKNOWN</span>';
                            eventIcon = '❓';
                            eventDesc = '未知事件';
                    }

                    return `
                        <div class="timeline-event">
                            <div class="timeline-time">
                                <span class="timeline-icon">${eventIcon}</span>
                                <span class="timeline-diff">${formatTimeDiff(timeDiff)}</span>
                            </div>
                            <div class="timeline-content">
                                <div class="timeline-header">
                                    <strong>${event.comm}</strong>
                                    ${eventTypeBadge}
                                </div>
                                <div class="timeline-detail">${eventDesc}</div>
                                <div class="timeline-meta">
                                    <span>🕐 ${eventTime.toLocaleTimeString()}</span>
                                    <span>📊 PID: ${event.pid}</span>
                                    <span>👤 UID: ${event.uid}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                timelineHTML = '<div class="timeline-empty">暂无事件记录</div>';
            }

            modal.innerHTML = `
                <div class="timeline-modal-content">
                    <div class="timeline-modal-header">
                        <h2>📊 提权事件时间线重建</h2>
                        <button class="timeline-close-btn" onclick="closeTimelineModal()">✕</button>
                    </div>
                    <div class="timeline-modal-body">
                        <div class="timeline-info">
                            <div class="timeline-info-item">
                                <span class="info-label">进程ID:</span>
                                <span class="info-value">${data.pid}</span>
                            </div>
                            <div class="timeline-info-item">
                                <span class="info-label">开始时间:</span>
                                <span class="info-value">${startTime.toLocaleString('zh-CN')}</span>
                            </div>
                            <div class="timeline-info-item">
                                <span class="info-label">提权时间:</span>
                                <span class="info-value" style="color: #dc3545; font-weight: bold;">${escalationTime.toLocaleString('zh-CN')}</span>
                            </div>
                            <div class="timeline-info-item">
                                <span class="info-label">时间窗口:</span>
                                <span class="info-value">${data.time_window} 分钟</span>
                            </div>
                            <div class="timeline-info-item">
                                <span class="info-label">事件总数:</span>
                                <span class="info-value">${data.total_events}</span>
                            </div>
                        </div>
                        <div class="timeline-events">
                            <div class="timeline-title">事件时间线</div>
                            ${timelineHTML}
                        </div>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        // 格式化时间差
        function formatTimeDiff(seconds) {
            if (seconds < 60) {
                return `${seconds}秒前`;
            } else if (seconds < 3600) {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes}分${secs}秒前`;
            } else {
                return `${Math.floor(seconds / 3600)}小时前`;
            }
        }

        // 关闭时间线模态框
        function closeTimelineModal() {
            const modal = document.getElementById('timelineModal');
            if (modal) {
                modal.remove();
            }
        }

        // 点击模态框外部关闭
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('timelineModal');
            if (modal && e.target === modal) {
                closeTimelineModal();
            }
            const exportModal = document.getElementById('exportModal');
            if (exportModal && e.target === exportModal) {
                closeExportModal();
            }
        });

        // 显示导出模态框
        function showExportModal(eventIDs, isBatch = false) {
            // 移除旧模态框
            const oldModal = document.getElementById('exportModal');
            if (oldModal) {
                oldModal.remove();
            }

            // 创建模态框
            const modal = document.createElement('div');
            modal.id = 'exportModal';
            modal.className = 'export-modal';

            const title = isBatch 
                ? `📄 批量导出取证报告 (${eventIDs.length} 个事件)` 
                : '📄 导出取证报告';

            modal.innerHTML = `
                <div class="export-modal-content">
                    <div class="export-modal-header">
                        <h2>${title}</h2>
                        <button class="export-close-btn" onclick="closeExportModal()">✕</button>
                    </div>
                    <div class="export-modal-body">
                        <div class="export-form-group">
                            <label>选择报告格式:</label>
                            <div class="export-format-options">
                                <label class="export-format-option selected">
                                    <input type="radio" name="reportFormat" value="markdown" checked onchange="selectExportFormat(this)">
                                    <div class="export-format-info">
                                        <div class="export-format-title">Markdown (.md)</div>
                                        <div class="export-format-desc">适合在 GitHub、Notion 等平台查看</div>
                                    </div>
                                </label>
                                <label class="export-format-option">
                                    <input type="radio" name="reportFormat" value="json" onchange="selectExportFormat(this)">
                                    <div class="export-format-info">
                                        <div class="export-format-title">JSON (.json)</div>
                                        <div class="export-format-desc">结构化数据，适合程序处理</div>
                                    </div>
                                </label>
                                <label class="export-format-option">
                                    <input type="radio" name="reportFormat" value="text" onchange="selectExportFormat(this)">
                                    <div class="export-format-info">
                                        <div class="export-format-title">纯文本 (.txt)</div>
                                        <div class="export-format-desc">简单文本格式，易于阅读</div>
                                    </div>
                                </label>
                            </div>
                        </div>
                        <div class="export-progress" id="exportProgress">
                            <div class="export-progress-bar">
                                <div class="export-progress-fill" id="exportProgressFill" style="width: 0%"></div>
                            </div>
                            <div class="export-progress-text" id="exportProgressText">准备导出...</div>
                        </div>
                    </div>
                    <div class="export-modal-footer">
                        <button class="btn btn-secondary" onclick="closeExportModal()">取消</button>
                        <button class="btn" onclick="executeExport(${JSON.stringify(eventIDs)}, ${isBatch})">导出</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        // 选择导出格式
        function selectExportFormat(radio) {
            const options = document.querySelectorAll('.export-format-option');
            options.forEach(opt => opt.classList.remove('selected'));
            radio.closest('.export-format-option').classList.add('selected');
        }

        // 关闭导出模态框
        function closeExportModal() {
            const modal = document.getElementById('exportModal');
            if (modal) {
                modal.remove();
            }
        }

        // 执行导出
        async function executeExport(eventIDs, isBatch) {
            const format = document.querySelector('input[name="reportFormat"]:checked').value;
            const progressDiv = document.getElementById('exportProgress');
            const progressFill = document.getElementById('exportProgressFill');
            const progressText = document.getElementById('exportProgressText');

            progressDiv.style.display = 'block';

            if (isBatch) {
                // 批量导出
                const total = eventIDs.length;
                for (let i = 0; i < total; i++) {
                    const progress = Math.round(((i + 1) / total) * 100);
                    progressFill.style.width = progress + '%';
                    progressText.textContent = `正在导出 ${i + 1}/${total} 个报告...`;

                    try {
                        await downloadReport(eventIDs[i], format, i);
                    } catch (error) {
                        console.error(`Failed to export report for event ${eventIDs[i]}:`, error);
                    }
                }
                progressText.textContent = `完成！已导出 ${total} 个报告`;
            } else {
                // 单个导出
                progressFill.style.width = '100%';
                progressText.textContent = '正在生成报告...';
                try {
                    await downloadReport(eventIDs[0], format);
                    progressText.textContent = '完成！';
                } catch (error) {
                    console.error('Failed to export report:', error);
                    progressText.textContent = '导出失败';
                }
            }

            setTimeout(() => {
                closeExportModal();
            }, 1000);
        }

        // 下载单个报告
        async function downloadReport(eventID, format, index = 0) {
            const response = await fetch(`http://${window.location.host}/api/report/forensic?event_id=${eventID}&format=${format}`);
            
            if (!response.ok) {
                throw new Error('Failed to generate report');
            }

            const content = await response.text();
            const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
            let extension = '';
            let mimeType = '';

            switch (format) {
                case 'markdown':
                    extension = 'md';
                    mimeType = 'text/markdown';
                    break;
                case 'json':
                    extension = 'json';
                    mimeType = 'application/json';
                    break;
                case 'text':
                    extension = 'txt';
                    mimeType = 'text/plain';
                    break;
            }

            const filename = `forensic_report_${eventID}_${timestamp}.${extension}`;
            
            // 创建下载链接
            const blob = new Blob([content], { type: mimeType });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        // 导出单个事件的取证报告
        function exportForensicReport(eventID) {
            if (!eventID) {
                alert('事件ID缺失，无法导出报告');
                return;
            }
            showExportModal([eventID], false);
        }

        // 批量导出取证报告
        async function exportForensicReportBatch() {
            try {
                const params = {
                    limit: 100
                };

                const riskLevel = document.getElementById('riskLevelFilter').value;
                const eventType = document.getElementById('eventTypeFilter').value;
                const agentId = document.getElementById('agentIdFilter').value;

                if (riskLevel) params.risk_level = riskLevel;
                if (eventType) params.event_type = eventType;
                if (agentId) params.agent_id = agentId;

                const queryParams = new URLSearchParams(params);
                const response = await fetch(`http://${window.location.host}/api/events?${queryParams}`);
                const events = await response.json();

                if (!events || events.length === 0) {
                    alert('当前没有事件可以导出');
                    return;
                }

                const eventIDs = events.map(e => e.id);
                showExportModal(eventIDs, true);
            } catch (error) {
                console.error('Failed to load events for export:', error);
                alert('加载事件列表失败');
            }
        }

        // 渲染表格视图（使用 React）
        function renderTableView() {
            const root = document.getElementById('react-table-root');
            if (!root) return;
            
            const { useState, useEffect } = React;
            
            function EventsTable({ events }) {
                return React.createElement('table', { className: 'events-table' },
                    React.createElement('thead', null,
                        React.createElement('tr', null,
                            React.createElement('th', null, 'ID'),
                            React.createElement('th', null, '进程名'),
                            React.createElement('th', null, 'PID'),
                            React.createElement('th', null, '用户'),
                            React.createElement('th', null, '时间'),
                            React.createElement('th', null, '事件类型'),
                            React.createElement('th', null, '权限提升'),
                            React.createElement('th', null, '风险等级'),
                            React.createElement('th', null, '操作')
                        )
                    ),
                    React.createElement('tbody', null,
                        events.map(event => {
                            const timestamp = new Date(event.timestamp / 1000000);
                            const timeStr = timestamp.toLocaleString('zh-CN', {
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit',
                                hour12: false
                            });
                            
                            const eventTypeMap = {
                                0: 'EXECVE',
                                1: 'SETUID',
                                2: 'FILE_WRITE'
                            };
                            
                            const riskClass = event.risk_level === 'HIGH' ? 'high' : 
                                           event.risk_level === 'MEDIUM' ? 'medium' : 'low';
                            
                            const riskColor = event.risk_level === 'HIGH' ? '#dc3545' : 
                                            event.risk_level === 'MEDIUM' ? '#ffc107' : '#28a745';
                            
                            return React.createElement('tr', { key: event.id, className: 'new-event' },
                                React.createElement('td', null, event.id),
                                React.createElement('td', null, 
                                    React.createElement('span', { style: { fontWeight: 600 } }, event.comm)
                                ),
                                React.createElement('td', null, event.pid),
                                React.createElement('td', null, event.uid),
                                React.createElement('td', null, timeStr),
                                React.createElement('td', null, eventTypeMap[event.event_type] || 'UNKNOWN'),
                                React.createElement('td', null, 
                                    event.is_privilege_escalation ? '⚠️ 是' : '否'
                                ),
                                React.createElement('td', null,
                                    React.createElement('span', { 
                                        style: { 
                                            color: riskColor,
                                            fontWeight: 600,
                                            padding: '2px 8px',
                                            borderRadius: '4px',
                                            background: riskColor + '20'
                                        }
                                    }, event.risk_level)
                                )
                            );
                        })
                    )
                );
            }
            
            ReactDOM.render(React.createElement(EventsTable, { events: currentEvents }), root);
        }

        // 修改 displayEvents 函数，保存当前事件数据
        const originalDisplayEvents = displayEvents;
        displayEvents = function(events) {
            currentEvents = events;
            originalDisplayEvents(events);
            if (currentView === 'table') {
                renderTableView();
            }
        };

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
            applyFilters();
            
            // 定期刷新统计数据（每10秒）
            setInterval(loadStatistics, 10000);
        });
    </script>
</body>
