<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBPF 安全事件监控仪表板</title>
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }
        .loading-spinner {
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #e0e0e0;
            font-size: 18px;
        }
        .loading-error {
            color: #dc3545;
            font-size: 16px;
            margin-top: 10px;
            max-width: 600px;
            text-align: center;
        }
        .retry-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
        }
        
        /* 错误提示 */
        .error-banner {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.3);
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .error-message {
            color: #dc3545;
            font-weight: 600;
        }
        .close-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 20px;
            padding: 0 8px;
        }
    </style>
</head>
<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-text">正在加载...</div>
        <div class="loading-error" id="loading-error"></div>
        <button class="retry-btn" id="retry-btn" style="display: none;" onclick="retryConnection()">重试连接</button>
    </div>

    <div class="container" id="app" style="display: none;">
        <!-- 头部 -->
        <div class="header" style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);">
            <h1 style="font-size: 32px; margin-bottom: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">🛡️ eBPF 安全事件监控仪表板</h1>
            <p style="color: #a0a0a0; font-size: 14px;">实时监控进程执行、权限提升和安全事件</p>
            <div style="display: flex; gap: 16px; margin-top: 20px; flex-wrap: wrap;">
                <div style="background: rgba(102, 126, 234, 0.2); border: 1px solid rgba(102, 126, 234, 0.3); padding: 12px 20px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    <span style="width: 10px; height: 10px; border-radius: 50%; background: #dc3545;" id="connection-status-dot"></span>
                    <span id="connection-status-text">未连接</span>
                </div>
                <div style="background: rgba(40, 167, 69, 0.2); border: 1px solid rgba(40, 167, 69, 0.3); padding: 12px 20px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    <span style="width: 10px; height: 10px; border-radius: 50%; background: #28a745; animation: pulse 2s infinite;"></span>
                    <span id="total-events">0</span> 事件总数
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 24px;">
            <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-left: 4px solid #dc3545;">
                <div style="font-size: 32px; margin-bottom: 12px;">🔴</div>
                <div style="color: #a0a0a0; font-size: 14px; margin-bottom: 8px;">高风险事件</div>
                <div style="font-size: 32px; font-weight: 700;" id="high-risk-count">0</div>
            </div>
            <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-left: 4px solid #ffc107;">
                <div style="font-size: 32px; margin-bottom: 12px;">🟡</div>
                <div style="color: #a0a0a0; font-size: 14px; margin-bottom: 8px;">中风险事件</div>
                <div style="font-size: 32px; font-weight: 700;" id="medium-risk-count">0</div>
            </div>
            <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-left: 4px solid #28a745;">
                <div style="font-size: 32px; margin-bottom: 12px;">🟢</div>
                <div style="color: #a0a0a0; font-size: 14px; margin-bottom: 8px;">低风险事件</div>
                <div style="font-size: 32px; font-weight: 700;" id="low-risk-count">0</div>
            </div>
        </div>

        <!-- 事件列表 -->
        <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 24px;">安全事件列表</h2>
                <div>
                    <button onclick="loadEvents()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; margin-right: 10px;">🔄 刷新</button>
                    <button onclick="sendTestEvent()" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #e0e0e0; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;">📤 发送测试事件</button>
                </div>
            </div>
            <div id="events-list" style="max-height: 600px; overflow-y: auto;">
                <div style="text-align: center; padding: 80px 20px; color: #a0a0a0;">
                    <div style="font-size: 64px; margin-bottom: 20px; opacity: 0.5;">📡</div>
                    <p>等待接收事件...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let eventCount = 0;

        // 显示加载状态
        function showLoading(message, error = null) {
            const overlay = document.getElementById('loading-overlay');
            const text = document.getElementById('loading-text');
            const errorDiv = document.getElementById('loading-error');
            const retryBtn = document.getElementById('retry-btn');
            
            text.textContent = message;
            
            if (error) {
                errorDiv.textContent = error;
                errorDiv.style.display = 'block';
                retryBtn.style.display = 'block';
            } else {
                errorDiv.style.display = 'none';
                retryBtn.style.display = 'none';
            }
            
            overlay.style.display = 'flex';
        }

        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        // 更新连接状态
        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connection-status-dot');
            const text = document.getElementById('connection-status-text');
            
            if (connected) {
                dot.style.background = '#28a745';
                text.textContent = '已连接';
            } else {
                dot.style.background = '#dc3545';
                text.textContent = '未连接';
            }
        }

        // 加载统计数据
        async function loadStatistics() {
            try {
                const response = await fetch(`http://${window.location.host}/api/statistics`, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache'
                    },
                    signal: AbortSignal.timeout(10000) // 10秒超时
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const stats = await response.json();
                
                document.getElementById('total-events').textContent = stats.total_events || 0;
                document.getElementById('high-risk-count').textContent = stats.risk_level_distribution?.HIGH || 0;
                document.getElementById('medium-risk-count').textContent = stats.risk_level_distribution?.MEDIUM || 0;
                document.getElementById('low-risk-count').textContent = stats.risk_level_distribution?.LOW || 0;
                
                return true;
            } catch (error) {
                console.error('Failed to load statistics:', error);
                return false;
            }
        }

        // 加载事件列表
        async function loadEvents() {
            try {
                const response = await fetch(`http://${window.location.host}/api/events?limit=50`, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache'
                    },
                    signal: AbortSignal.timeout(10000)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const events = await response.json();
                displayEvents(events);
                return true;
            } catch (error) {
                console.error('Failed to load events:', error);
                return false;
            }
        }

        // 显示事件
        function displayEvents(events) {
            const list = document.getElementById('events-list');
            
            if (!events || events.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 80px 20px; color: #a0a0a0;">
                        <div style="font-size: 64px; margin-bottom: 20px; opacity: 0.5;">📭</div>
                        <p>暂无事件</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = events.map(event => {
                const timestamp = new Date(event.timestamp / 1000000).toLocaleString('zh-CN');
                const riskClass = event.risk_level === 'HIGH' ? 'high' : event.risk_level === 'MEDIUM' ? 'medium' : 'low';
                const riskColor = event.risk_level === 'HIGH' ? '#dc3545' : event.risk_level === 'MEDIUM' ? '#ffc107' : '#28a745';
                
                return `
                    <div style="background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 20px; margin-bottom: 12px; border-left: 4px solid ${riskColor}; transition: all 0.3s;" onmouseover="this.style.transform='translateX(4px)'" onmouseout="this.style.transform='translateX(0)'">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                <span style="font-weight: 700; font-size: 18px;">${event.comm}</span>
                                <span style="background: rgba(255, 255, 255, 0.1); padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #a0a0a0;">PID: ${event.pid}</span>
                                <span style="padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; background: rgba(${riskColor === '#dc3545' ? '220, 53, 69' : riskColor === '#ffc107' ? '255, 193, 7' : '40, 167, 69'}, 0.2); color: ${riskColor}; border: 1px solid ${riskColor}33;">${event.risk_level}</span>
                            </div>
                            <span style="color: #a0a0a0; font-size: 13px;">${timestamp}</span>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; font-size: 13px; color: #e0e0e0;">
                            <div>👤 UID: ${event.uid} | EUID: ${event.euid}</div>
                            <div>📁 ${event.filename || event.filepath || 'N/A'}</div>
                            <div>🔧 类型: ${getEventTypeLabel(event.event_type)}</div>
                            ${event.is_privilege_escalation ? '<div style="color: #dc3545; font-weight: 600;">⚠️ 权限提升</div>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 获取事件类型标签
        function getEventTypeLabel(type) {
            const types = {
                0: 'EXECVE',
                1: 'SETUID',
                2: 'FILE_WRITE',
                3: 'OPENAT',
                4: 'CONNECT',
                5: 'BIND',
                6: 'EXIT'
            };
            return types[type] || 'UNKNOWN';
        }

        // 连接 WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function() {
                    console.log('WebSocket connected');
                    updateConnectionStatus(true);
                    reconnectAttempts = 0;
                };
                
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    eventCount++;
                    document.getElementById('total-events').textContent = eventCount;
                    
                    // 更新事件列表（只显示最新的）
                    loadEvents();
                    loadStatistics();
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    updateConnectionStatus(false);
                };
                
                ws.onclose = function() {
                    console.log('WebSocket closed');
                    updateConnectionStatus(false);
                    
                    // 尝试重连
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        console.log(`Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`);
                        setTimeout(connectWebSocket, 3000 * reconnectAttempts);
                    }
                };
            } catch (error) {
                console.error('Failed to create WebSocket:', error);
                updateConnectionStatus(false);
            }
        }

        // 发送测试事件
        async function sendTestEvent() {
            try {
                const event = {
                    timestamp: Date.now() * 1000000,
                    pid: Math.floor(Math.random() * 10000) + 1000,
                    ppid: Math.floor(Math.random() * 1000) + 1,
                    uid: Math.floor(Math.random() * 2000),
                    gid: Math.floor(Math.random() * 2000),
                    euid: Math.floor(Math.random() * 2000),
                    egid: Math.floor(Math.random() * 2000),
                    old_uid: Math.floor(Math.random() * 2000),
                    new_uid: Math.floor(Math.random() * 2000),
                    event_type: Math.floor(Math.random() * 7),
                    target_file_type: 0,
                    comm: ['ls', 'cd', 'sudo', 'npm', 'python3', 'go', 'passwd'][Math.floor(Math.random() * 7)],
                    filename: '/usr/bin/' + ['ls', 'cd', 'sudo', 'cat', 'grep', 'passwd'][Math.floor(Math.random() * 6)],
                    filepath: '',
                    is_privilege_escalation: Math.random() > 0.7
                };
                
                const response = await fetch(`http://${window.location.host}/api/events`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event),
                    signal: AbortSignal.timeout(10000)
                });
                
                if (response.ok) {
                    alert('测试事件发送成功！');
                    loadEvents();
                    loadStatistics();
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('Failed to send test event:', error);
                alert('发送测试事件失败: ' + error.message);
            }
        }

        // 重试连接
        function retryConnection() {
            showLoading('正在重试连接...');
            initializeApp();
        }

        // 初始化应用
        async function initializeApp() {
            try {
                // 检查服务器健康状态
                const healthResponse = await fetch(`http://${window.location.host}/api/health`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000)
                });
                
                if (!healthResponse.ok) {
                    throw new Error('服务器未响应');
                }
                
                // 加载统计数据
                const statsLoaded = await loadStatistics();
                if (!statsLoaded) {
                    throw new Error('无法加载统计数据');
                }
                
                // 加载事件列表
                const eventsLoaded = await loadEvents();
                if (!eventsLoaded) {
                    throw new Error('无法加载事件列表');
                }
                
                // 隐藏加载界面
                hideLoading();
                
                // 连接 WebSocket
                connectWebSocket();
                
                // 定期刷新统计数据
                setInterval(loadStatistics, 30000); // 每30秒刷新一次
                
            } catch (error) {
                console.error('Initialization failed:', error);
                showLoading('初始化失败', `错误: ${error.message}\n\n请确保:\n1. Server 正在运行\n2. 端口 8080 可访问\n3. 数据库未锁定\n\n如需帮助，请查看:\nServer 日志: tail -f server/server.log`);
            }
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', function() {
            showLoading('正在连接服务器...');
            initializeApp();
        });

        // 页面卸载时关闭 WebSocket
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
