<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBPF 进程监控测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .status {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .status-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
        }
        .events-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .events-header h2 {
            color: #333;
            font-size: 22px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .events-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .event-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .event-item:hover {
            transform: translateX(4px);
        }
        .event-item.privilege-escalation {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        .event-item.privilege-escalation .badge {
            background: #ffc107;
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .event-comm {
            font-weight: 700;
            font-size: 16px;
            color: #333;
        }
        .event-pid {
            color: #666;
            font-size: 14px;
        }
        .event-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
            font-size: 13px;
            color: #555;
        }
        .event-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .connection-status {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .connected {
            background: #28a745;
            box-shadow: 0 0 8px #28a745;
        }
        .disconnected {
            background: #dc3545;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 eBPF 进程监控</h1>
            <div class="status">
                <div class="status-item">
                    <span class="connection-status disconnected" id="connectionStatus"></span>
                    <span id="connectionText">未连接</span>
                </div>
                <div class="status-item">
                    📊 事件总数: <span id="eventCount">0</span>
                </div>
            </div>
        </div>

        <div class="events-container">
            <div class="events-header">
                <h2>实时事件</h2>
                <button class="btn" onclick="sendTestEvent()">📤 发送测试事件</button>
            </div>
            <div class="events-list" id="eventsList">
                <div class="empty-state">
                    <div class="empty-state-icon">📡</div>
                    <p>等待接收事件...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const eventsList = document.getElementById('eventsList');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionText = document.getElementById('connectionText');
        const eventCount = document.getElementById('eventCount');
        let totalEvents = 0;

        // 从服务器加载历史事件
        async function loadHistoricalEvents() {
            try {
                const response = await fetch(`http://${window.location.host}/api/events`);
                const events = await response.json();
                
                // 清空空状态
                const emptyState = eventsList.querySelector('.empty-state');
                if (emptyState) {
                    emptyState.remove();
                }

                // 显示历史事件（倒序，最新的在前面）
                events.reverse().forEach(data => {
                    totalEvents++;
                    eventCount.textContent = totalEvents;
                    addEventToUI(data);
                });
            } catch (error) {
                console.error('Failed to load historical events:', error);
            }
        }

        // 添加事件到UI
        function addEventToUI(data) {
            // 移除空状态
            const emptyState = eventsList.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            // 格式化时间戳（纳秒转毫秒）
            const timestamp = new Date(data.timestamp / 1000000);
            const timeStr = timestamp.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            // 根据事件类型确定显示的信息
            let eventDesc = '';
            let eventTypeBadge = '';
            
            switch(data.event_type) {
                case 0: // EVENT_EXECVE
                    eventDesc = `📁 ${data.filename}`;
                    eventTypeBadge = '<span class="badge" style="background: #667eea;">EXECVE</span>';
                    break;
                case 1: // EVENT_SETUID
                    eventDesc = `🔐 UID 变更: ${data.old_uid} → ${data.new_uid}`;
                    eventTypeBadge = '<span class="badge" style="background: #ffc107;">SETUID</span>';
                    break;
                case 2: // EVENT_FILE_WRITE
                    let fileName = data.filepath || data.filename;
                    eventDesc = `📝 写入文件: ${fileName}`;
                    eventTypeBadge = '<span class="badge" style="background: #dc3545;">FILE_WRITE</span>';
                    break;
                default:
                    eventDesc = `📁 ${data.filename}`;
                    eventTypeBadge = '<span class="badge" style="background: #6c757d;">UNKNOWN</span>';
            }

            const privilegeBadge = data.is_privilege_escalation 
                ? '<span class="badge" style="background: #dc3545;">⚠️ 权限提升</span>' 
                : '<span class="badge" style="background: #28a745;">正常</span>';

            // 添加新事件
            const eventItem = document.createElement('div');
            eventItem.className = 'event-item' + (data.is_privilege_escalation ? ' privilege-escalation' : '');
            
            eventItem.innerHTML = `
                <div class="event-header">
                    <span class="event-comm">${data.comm}</span>
                    <span class="event-pid">PID: ${data.pid} | PPID: ${data.ppid}</span>
                </div>
                <div class="event-details">
                    <div class="event-detail-item">🕐 ${timeStr}</div>
                    <div class="event-detail-item">${eventDesc}</div>
                    <div class="event-detail-item">👤 UID: ${data.uid} | EUID: ${data.euid}</div>
                    <div class="event-detail-item">👥 GID: ${data.gid} | EGID: ${data.egid}</div>
                    <div class="event-detail-item">${eventTypeBadge}</div>
                    <div class="event-detail-item">${privilegeBadge}</div>
                </div>
            `;

            eventsList.insertBefore(eventItem, eventsList.firstChild);

            // 限制显示数量
            while (eventsList.children.length > 50) {
                eventsList.removeChild(eventsList.lastChild);
            }
        }

        // 页面加载时获取历史事件
        window.addEventListener('DOMContentLoaded', loadHistoricalEvents);

        ws.onopen = function() {
            connectionStatus.classList.remove('disconnected');
            connectionStatus.classList.add('connected');
            connectionText.textContent = '已连接';
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            totalEvents++;
            eventCount.textContent = totalEvents;
            addEventToUI(data);
        };

        ws.onerror = function() {
            connectionStatus.classList.remove('connected');
            connectionStatus.classList.add('disconnected');
            connectionText.textContent = '连接错误';
        };

        ws.onclose = function() {
            connectionStatus.classList.remove('connected');
            connectionStatus.classList.add('disconnected');
            connectionText.textContent = '已断开';
        };

        function sendTestEvent() {
            const timestamp = Date.now() * 1000000;
            const eventTypes = [0, 1, 2]; // EXECVE, SETUID, FILE_WRITE
            const eventType = eventTypes[Math.floor(Math.random() * eventTypes.length)];
            
            let event = {
                timestamp: timestamp,
                pid: Math.floor(Math.random() * 10000) + 1000,
                ppid: Math.floor(Math.random() * 1000) + 1,
                uid: Math.floor(Math.random() * 2000),
                gid: Math.floor(Math.random() * 2000),
                euid: Math.floor(Math.random() * 2000),
                egid: Math.floor(Math.random() * 2000),
                old_uid: Math.floor(Math.random() * 2000),
                new_uid: Math.floor(Math.random() * 2000),
                event_type: eventType,
                target_file_type: 0,
                comm: ['ls', 'cd', 'sudo', 'npm', 'python3', 'go', 'passwd'][Math.floor(Math.random() * 7)],
                filename: ['/usr/bin/' + ['ls', 'cd', 'sudo', 'cat', 'grep', 'passwd'][Math.floor(Math.random() * 6)]][0],
                filepath: '',
                is_privilege_escalation: Math.random() > 0.7
            };
            
            // 根据事件类型设置特定字段
            if (eventType === 1) { // SETUID
                event.old_uid = Math.floor(Math.random() * 2000);
                event.new_uid = 0; // 提升到 root
                event.is_privilege_escalation = true;
            } else if (eventType === 2) { // FILE_WRITE
                const files = ['passwd', 'shadow'];
                event.filepath = '/etc/' + files[Math.floor(Math.random() * files.length)];
                event.target_file_type = event.filepath.includes('passwd') ? 1 : 2;
            }

            fetch(`http://${window.location.host}/api/events`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(event)
            });
        }
    </script>
</body>
</html>
