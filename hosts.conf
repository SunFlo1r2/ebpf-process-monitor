# 多主机配置文件
# 格式: agent_id|ssh_host|ssh_port|ssh_user
# 使用竖线 | 分隔字段

# 被监控服务器配置
monitored-server-01|47.116.104.238|22|root
monitored-server-02|47.116.103.136|22|root

# 服务器配置 - 使用主服务器的公网IP
server_url=http://47.116.104.238:8080/api/events

# 说明：
# 1. agent_id: 用于标识不同主机的唯一 ID
# 2. ssh_host: 虚拟机的 IP 地址或主机名
# 3. ssh_port: SSH 端口号（默认 22）
# 4. ssh_user: SSH 用户名（需要 root 权限或 sudo 权限）
# 5. server_url: 中央服务器的地址（使用公网IP以便远程主机访问）